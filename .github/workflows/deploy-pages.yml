name: Deploy wiki and demo to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - 'wiki/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build wiki
        run: npm run build --workspace=@dockpilot/wiki
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Prepare static demo
        run: |
          mkdir -p pages-site
          node demo/prepare-pages.mjs

      - name: Assemble wiki Pages site
        run: |
          cp -R wiki/src/.vitepress/dist/. pages-site/
          test -s pages-site/index.html

      - name: Add wiki link to demo
        run: |
          node --input-type=module <<'EOF'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'pages-site/demo/index.html';
          let html = await readFile(path, 'utf8');
          html = html.replace('</body>', '<a class="wiki-link" href="../">← DockPilot Wiki</a><style>.wiki-link{position:fixed;top:12px;right:14px;z-index:5;padding:7px 10px;border:1px solid #34465b;border-radius:6px;background:#121d2a;color:#bdd6f5;font:10px ui-monospace,monospace;text-decoration:none}.wiki-link:hover{border-color:#5c8abb;color:white}</style></body>');
          await writeFile(path, html);
          EOF
          test -s pages-site/demo/index.html
          test -s pages-site/demo/demo.css
          test -s pages-site/demo/demo.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
