<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="An interactive local-only DockPilot demo with three simulated Docker nodes."
    />
    <meta name="demo-mode" content="browser-local-only" />
    <title>DockPilot Demo — Docker, without the guessing.</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./demo.css" />
    <script defer src="./demo.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="DockPilot demo home"
          ><span class="brand-mark">✣</span
          ><span
            >dock<span class="brand-light">pilot</span><i>.</i><small>LIVE DEMO</small></span
          ></a
        >
        <button class="workspace-switch" data-action="workspace">
          <span class="workspace-icon">⌂</span
          ><span><small>WORKSPACE</small><strong>Demo homelab</strong></span
          ><span class="chevron">⌄</span>
        </button>
        <nav class="nav-list" aria-label="Demo navigation">
          <p class="nav-caption">WORKSPACE</p>
          <button class="nav-item active" data-page="overview"><span>◫</span> Overview</button>
          <p class="nav-caption">INFRASTRUCTURE <span>3</span></p>
          <button class="nav-item" data-page="hosts">
            <span>▣</span> Hosts <b class="nav-count">3</b>
          </button>
          <button class="nav-item" data-page="containers">
            <span>▤</span> Containers <b class="nav-count">8</b>
          </button>
          <button class="nav-item" data-page="images"><span>⬡</span> Images</button>
          <button class="nav-item" data-page="volumes"><span>▱</span> Volumes</button>
          <button class="nav-item" data-page="networks"><span>⌘</span> Networks</button>
          <p class="nav-caption">OPERATIONS</p>
          <button class="nav-item" data-page="activity"><span>◷</span> Activity</button>
          <button class="nav-item" data-page="security">
            <span>⬡</span> Security <span class="nav-pill">2</span>
          </button>
          <button class="nav-item" data-page="settings"><span>⚙</span> Settings</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="sidebar-help" data-action="help">
            <span>?</span
            ><span><strong>Demo controls</strong><small>Explore a simulated homelab</small></span
            ><span class="chevron">↗</span>
          </button>
          <div class="profile">
            <span class="avatar">D</span
            ><span><strong>Demo Operator</strong><small>Local preview</small></span
            ><button class="more" data-action="reset" aria-label="Reset demo">···</button>
          </div>
        </div>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs">
            <span>Demo homelab</span><span>/</span><strong id="crumb-title">Overview</strong>
          </div>
          <div class="top-actions">
            <span class="demo-status"><i></i> DEMO ENVIRONMENT</span
            ><button class="icon-button" data-action="notifications" aria-label="Notifications">
              ♧<span class="notification-dot"></span></button
            ><button class="top-avatar" data-action="profile">D</button>
          </div>
        </header>
        <div class="content" id="page-content" tabindex="-1"></div>
      </main>
    </div>
    <div class="demo-banner">
      <span class="pulse-dot"></span><strong>Interactive demo</strong
      ><span>Simulated infrastructure · Changes stay in this browser</span
      ><button data-action="reset">Reset demo</button
      ><button class="banner-close" data-action="dismiss-banner" aria-label="Dismiss demo notice">
        ×
      </button>
    </div>
    <div id="toast-region" aria-live="polite" class="toast-region"></div>
    <dialog id="modal" class="modal">
      <form method="dialog">
        <button class="modal-close" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </form>
    </dialog>
  <a class="wiki-link" href="../">← DockPilot Wiki</a><style>.wiki-link{position:fixed;top:12px;right:14px;z-index:5;padding:7px 10px;border:1px solid #34465b;border-radius:6px;background:#121d2a;color:#bdd6f5;font:10px ui-monospace,monospace;text-decoration:none}.wiki-link:hover{border-color:#5c8abb;color:white}</style></body>
</html>
