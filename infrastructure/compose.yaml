name: dockpilot-local
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dockpilot
      POSTGRES_USER: dockpilot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - dockpilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dockpilot -d dockpilot']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
volumes:
  dockpilot-postgres:
